<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Jyutping Search</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 16px auto; padding: 0 12px; }
  .search-container { display: flex; align-items: center; gap: 10px; }
  .home-title { font-size: 32px; font-weight: 700; cursor: pointer; user-select: none; line-height: 1; padding: 4px 8px; border: 2px solid #000; }
  .home-title:hover { background: #f2f2f2; }
  input { flex: 1; padding: 12px; font-size: 16px; box-sizing: border-box; }
  .hint { color:#666; font-size: 14px; margin: 8px 0 14px; }
  .card { border:1px solid #ddd; border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: #fff; }
  .entry { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .tag { display:inline-block; margin: 2px 4px 0 0; padding: 2px 6px; font-size: 13px; background:#f2f2f2; border-radius:999px; cursor:pointer; }
  .tag:hover { background:#e6e6e6; }
  .muted { color:#666; font-size: 12px; margin-top: 16px; text-align: center; }
  .footer-links { text-align: center; font-size: 11px; margin-top: 6px; color: #888; }
  .footer-links a { color: #888; text-decoration: none; }
  .footer-links a:hover { text-decoration: underline; }
  .section { margin-top: 4px; font-size: 13px; line-height: 1.3; }

  /* Responsive Grid Layout */
  #out { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 10px; margin-top: 10px; }
  #out > h3 { grid-column: 1 / -1; margin: 4px 0; }
  #out > p { grid-column: 1 / -1; }

  /* Mobile / Small screen adjustments */
  @media (max-width: 600px) {
    #out { grid-template-columns: 1fr; gap: 6px; }
    .card { padding: 6px 8px; }
    .entry { font-size: 16px; }
    .tag { font-size: 11px; padding: 1px 4px; }
    .section { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="search-container">
  <div class="home-title" onclick="goHome()" title="Back to Home">中</div>
  <input id="q" placeholder="Type a character, word, English, jyutping, or #character:心, #jyutping:sam1, #pinyin:xīn, #radical:心">
</div>
<div class="hint">Click any jyutping to view all characters/words with that pronunciation.</div>
<div id="status" class="muted"></div>
<div id="out"></div>
<div class="muted">Thanks | Quick Jyutping Search</div>
<div class="footer-links">Data reference: <a href="https://words.hk/" target="_blank" rel="noopener">粵典</a></div>

<script>
const CHARLIST_URL = "./charlist.json";
const WORDLIST_URL  = "./wordlist.json";
const ENGLISH_URL   = "./englishindex.json";
const HANZI_URL = "./cdict.json";
//const CHARLIST_URL = "https://words.hk/faiman/analysis/charlist.json";
//const WORDLIST_URL  = "https://words.hk/faiman/analysis/wordslist.json";
//const ENGLISH_URL   = "https://words.hk/faiman/analysis/englishindex.json";

const q = document.getElementById('q');
const out = document.getElementById('out');
const status = document.getElementById('status');

const items = [];
const byJyutping = new Map();
const byEntry = new Map();
const byEnglish = new Map();
const byChar = new Map();
const byRadical = new Map();
const byPinyin = new Map();
const byPinyinBase = new Map();

const TONE_RE = /[\u0300\u0301\u0304\u030c]/g;
const pyKey = s => String(s).trim().toLowerCase().normalize('NFC');
const pyBase = s => String(s).trim().toLowerCase().normalize('NFD').replace(TONE_RE, '').normalize('NFC');
const hasTone = s => /[\u0300\u0301\u0304\u030c]/.test(String(s).normalize('NFD'));

function addHanzi(ch, d) {
  let py = d.pronunciation_mandarin_pinyin, zy = d.pronunciation_mandarin_zhuyin;
  if (!py && Array.isArray(d.pronunciation_mandarin)) {
    const m = d.pronunciation_mandarin;
    py = m.filter(x => !/[\u3100-\u312f]/.test(x));
    zy = m.filter(x => /[\u3100-\u312f]/.test(x));
  }
  py = (py || []).filter(Boolean);
  zy = (zy || []).filter(Boolean);
  const rec = { radical: d.radical || '', pinyin: py, zhuyin: zy, strokes: d.strokes_total ?? null };
  byChar.set(ch, rec);
  if (rec.radical) {
    if (!byRadical.has(rec.radical)) byRadical.set(rec.radical, []);
    byRadical.get(rec.radical).push(ch);
  }
  for (const p of py) {
    for (const [map, k] of [[byPinyin, pyKey(p)], [byPinyinBase, pyBase(p)]]) {
      if (!map.has(k)) map.set(k, []);
      if (!map.get(k).includes(ch)) map.get(k).push(ch);
    }
  }
}

function addItem(entry, jyutpings, source, weight=null, englishKey=null) {
  const clean = [...new Set((jyutpings || []).map(x => String(x).trim()).filter(Boolean))];
  const item = { entry: String(entry), jyutpings: clean, source, weight, englishKey };
  items.push(item);

  const entryKey = item.entry.toLowerCase();
  if (!byEntry.has(entryKey)) byEntry.set(entryKey, []);
  byEntry.get(entryKey).push(item);

  for (const j of clean) {
    const key = j.toLowerCase();
    if (!byJyutping.has(key)) byJyutping.set(key, []);
    byJyutping.get(key).push(item);
  }

  if (englishKey) {
    const k = englishKey.toLowerCase();
    if (!byEnglish.has(k)) byEnglish.set(k, []);
    byEnglish.get(k).push(item);
  }
}

function parseEnglishIndex(json) {
  // Supports:
  // {
  //   "carrot": [["胡蘿蔔:wu4 lo4 baak6", 100], ...],
  //   "!carrot": ...
  // }
  for (const [english, rows] of Object.entries(json)) {
    const cleanEnglish = english.replace(/^!/, '');
    if (!Array.isArray(rows)) continue;

    for (const row of rows) {
      if (!Array.isArray(row) || row.length < 1) continue;
      const s = String(row[0]);
      const weight = row[1] ?? null;
      const idx = s.lastIndexOf(':');
      if (idx < 0) continue;

      const entry = s.slice(0, idx);
      const jyutping = s.slice(idx + 1);
      addItem(entry, [jyutping], "english-index", weight, cleanEnglish);
    }
  }
}

function render(list, titleNote = "", isPronunciationTable = false, isDetailView = false) {
  if (!list.length) {
    out.innerHTML = "<p>No results.</p>";
    return;
  }

  const headerHtml = titleNote ? `<h3>${escapeHtml(titleNote)}</h3>` : '';

  if (isPronunciationTable) {
    out.innerHTML = headerHtml + `<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;">` +
      list.map(item => `
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; font-size: 32px; font-weight: 700; border: 3px solid blue; background: #fff; border-radius: 0px; cursor: pointer;" onclick="searchByCharacter('${escapeJs(item.entry)}')">
          ${escapeHtml(item.entry)}
        </span>
      `).join('') + `</div>`;
    return;
  }

  // If viewing a single entry detail page (#character:xxx or exact single result)
    if (isDetailView && list.length === 1) {
    const item = list[0], h = item.hanzi;
    const ZH = "font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif;";
    const T = 'font-size:18px;padding:6px 6px;';
    const jy = item.jyutpings.map(j => `<span class="tag" style="${T}" onclick="searchByJyutping('${escapeJs(j)}')">${escapeHtml(j)}</span>`).join(' ');
    const py = h && h.pinyin.length ? h.pinyin.map(p => `<span class="tag" lang="zh-Hant" style="${T}" onclick="searchByPinyin('${escapeJs(p)}')">${escapeHtml(p)}</span>`).join(' ') : '';
    const zy = h && h.zhuyin.length ? h.zhuyin.map(z => `<span class="tag" lang="zh-Hant" style="${T}${ZH}cursor:default;">${escapeHtml(z)}</span>`).join(' ') : '';
    const pz = (py || zy) ? `<div style="display:flex;flex-wrap:wrap;gap:12px 20px;">
        ${py ? `<div><b>Pinyin (拼音):</b><div style="margin-top:3px;">${py}</div></div>` : ''}
        ${zy ? `<div><b>Zhuyin (注音):</b><div style="margin-top:3px;">${zy}</div></div>` : ''}
      </div>` : '';
    const rad = h && h.radical ? `<div style="color:#555; font-size:15px;margin-bottom:10px;">Radical: <span class="tag" lang="zh-Hant" style="color:#222; font-size:18px;${ZH}" onclick="searchByRadical('${escapeJs(h.radical)}')">${escapeHtml(h.radical)}</span>${h.strokes != null ? ` <span style="color:#555;font-size:15px;">Strokes: ${h.strokes}</span>` : ''}</div>` : '';
    out.innerHTML = headerHtml + `
      <div style="border: 2px solid #333; border-radius: 12px; padding: 24px; margin-top: 16px; background: #fafafa; max-width: 600px;">
        <div style="font-size: 56px; font-weight: 800; margin-bottom: 16px; border-bottom: 2px solid #ddd; padding-bottom: 8px;">${escapeHtml(item.entry)}</div>
        <div style="display:flex; flex-wrap:wrap; gap:12px 28px; font-size:18px; margin-bottom:12px;">
          <div><b>Jyutping (粵拼):</b><div style="margin-top:6px;">${jy}</div></div>
          ${pz}
        </div>
        ${rad}
        ${item.englishKey ? `<div style="font-size: 18px; margin-top: 16px;"><b>English meanings:</b><br><div style="margin-top: 6px; font-size: 16px; color: #444;">${escapeHtml(item.englishKey)}</div></div>` : ''}
        <div style="margin-top: 20px;"><button onclick="goHome()" style="padding: 8px 16px; font-size: 14px; cursor: pointer;">← Back to Home</button></div>
      </div>`;
    return;
  }

  // Standard Compact Grid List for multiple search results
  out.innerHTML = headerHtml + list.map(item => `
    <div class="card">
      <div class="entry" style="cursor:pointer;" onclick="searchByCharacter('${escapeJs(item.entry)}')">${escapeHtml(item.entry)}</div>
      <div class="section"><b>Jyutping:</b> ${
        item.jyutpings.map(j => `<span class="tag" onclick="searchByJyutping('${escapeJs(j)}')">${escapeHtml(j)}</span>`).join(' ')
      }</div>
      ${item.englishKey ? `<div class="section"><b>English:</b> ${escapeHtml(item.englishKey)}</div>` : ''}
    </div>
  `).join('');
}

function searchByJyutping(jyutping) {
  const term = `#jyutping:${jyutping}`;
  q.value = term;
  location.hash = encodeURIComponent(term);
  search(term);
}
function searchByPinyin(p) {
  const term = `#pinyin:${p}`;
  q.value = term;
  location.hash = encodeURIComponent(term);
  search(term);
}

function searchByRadical(r) {
  const term = `#radical:${r}`;
  q.value = term;
  location.hash = encodeURIComponent(term);
  search(term);
}

function searchByCharacter(char) {
  const term = `#character:${char}`;
  q.value = term;
  location.hash = encodeURIComponent(term);
  search(term);
}

function search(term) {
  term = String(term || '').trim();
  q.value = term;
  if (term) {
    location.hash = encodeURIComponent(term);
  } else {
    history.pushState("", document.title, window.location.pathname + window.location.search);
  }

  const t = term.toLowerCase();
  if (!t) {
    showRandomFrontPage();
    return;
  }

  const resultMap = new Map();

  // Handle #jyutping:xxx specially (renders pronunciation grid table with unique characters)
  if (t.startsWith('#jyutping:')) {
    const jyutpingQuery = term.slice(10).trim().toLowerCase();
    const uniqueCharMap = new Map();

    if (byJyutping.has(jyutpingQuery)) {
      for (const item of byJyutping.get(jyutpingQuery)) {
        if (item.entry && item.entry.trim().length === 1) {
          const charKey = item.entry.trim();
          if (!uniqueCharMap.has(charKey)) {
            uniqueCharMap.set(charKey, item);
          }
        }
      }
    }
    const tableResults = [...uniqueCharMap.values()];
    render(tableResults, `${term.slice(10)}`, true);
    status.textContent = `${tableResults.length} single character(s) with pronunciation "${term.slice(10)}"`;
    return;
  }

  if (t.startsWith('#pinyin:')) {
    const pq = term.slice(8).trim();
    const exact = hasTone(pq);
    const chars = ((exact ? byPinyin.get(pyKey(pq)) : byPinyinBase.get(pyBase(pq))) || []).map(c => ({ entry: c }));
    render(chars, `${pq} (拼音)`, true);
    status.textContent = `${chars.length} character(s) with pinyin "${pq}"${exact ? '' : ' (all tones)'}`;
    return;
  }
  if (t.startsWith('#radical:')) {
    const rq = term.slice(9).trim();
    const chars = (byRadical.get(rq) || []).map(c => ({ entry: c }));
    render(chars, `Radical ${rq}`, true);
    status.textContent = `${chars.length} character(s) with radical "${rq}"`;
    return;
  }

  // Populate resultMap for #character:xxx or general text queries
  if (t.startsWith('#character:')) {
    const charQuery = term.slice(11).trim().toLowerCase();
    if (byEntry.has(charQuery)) {
      for (const item of byEntry.get(charQuery)) resultMap.set(keyOf(item), item);
    }
  } else {
    if (byEntry.has(t)) {
      for (const item of byEntry.get(t)) resultMap.set(keyOf(item), item);
    }
    if (byJyutping.has(t)) {
      for (const item of byJyutping.get(t)) resultMap.set(keyOf(item), item);
    }
    if (byEnglish.has(t)) {
      for (const item of byEnglish.get(t)) resultMap.set(keyOf(item), item);
    }
    for (const item of items) {
      if (
        item.entry.toLowerCase().includes(t) ||
        item.jyutpings.some(j => j.toLowerCase().includes(t)) ||
        (item.englishKey && item.englishKey.toLowerCase().includes(t))
      ) {
        resultMap.set(keyOf(item), item);
      }
    }
  }

  // Unified deduplication and grouping for all matched items
  const entryKeys = new Set([...resultMap.values()].map(i => i.entry.toLowerCase()));
  const rawResults = [...entryKeys].flatMap(k => byEntry.get(k) || []);
  const groupedMap = new Map();

  for (const item of rawResults) {
    const entryKey = item.entry.trim();
    if (!groupedMap.has(entryKey)) {
      groupedMap.set(entryKey, {
        entry: item.entry,
        jyutpings: new Set(item.jyutpings || []),
        englishKeys: new Set(item.englishKey ? [item.englishKey] : []),
        source: item.source
      });
    } else {
      const existing = groupedMap.get(entryKey);
      if (item.jyutpings) {
        item.jyutpings.forEach(j => existing.jyutpings.add(j));
      }
      if (item.englishKey) {
        existing.englishKeys.add(item.englishKey);
      }
    }
  }

  const finalResult = [...groupedMap.values()].map(g => ({
    entry: g.entry,
    jyutpings: [...g.jyutpings],
    englishKey: [...g.englishKeys].filter(Boolean).join(', '),
    source: g.source,
    hanzi: byChar.get(g.entry.trim()) || null
  }));

  const isDetail = t.startsWith('#character:') || (finalResult.length === 1 && finalResult[0].entry.toLowerCase() === t);
  render(finalResult, "", false, isDetail);
  status.textContent = `${finalResult.length} result(s) for "${term}"`;
}

function showRandomFrontPage() {
  if (!items.length) return;
  const randomItem = items[Math.floor(Math.random() * items.length)];
  render([randomItem], "Random Word / Character");
  status.textContent = `Loaded ${items.length} entries. Showing random featured item.`;
}
function goHome() {
  q.value = "";
  history.pushState("", document.title, window.location.pathname + window.location.search);
  showRandomFrontPage();
}

function keyOf(item) {
  return `${item.source}|${item.entry}|${item.jyutpings.join(',')}|${item.englishKey || ''}|${item.weight ?? ''}`;
}

async function loadJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed to load ${url}: ${res.status}`);
  return await res.json();
}

async function loadJsonWithTimeout(url, timeoutMs = 2000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`Failed to load ${url}: ${res.status}`);
    return await res.json();
  } catch (err) {
    clearTimeout(timeoutId);
    throw err;
  }
}

async function build() {
  status.textContent = "Loading...";

  // Add sample placeholder entry as offline fallback
  addItem("心", ["sam1"], "sample", null, "heart");

  const initial = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";

  try {
    // Attempt loading with 2s timeout
      const [charlist, wordlist, englishIndex, cdict] = await Promise.all([
      loadJsonWithTimeout(CHARLIST_URL, 2000),
      loadJsonWithTimeout(WORDLIST_URL, 2000),
      loadJsonWithTimeout(ENGLISH_URL, 2000),
      loadJsonWithTimeout(HANZI_URL, 6000).catch(() => null)
    ]);

    for (const [entry, readingsObj] of Object.entries(charlist)) {
      addItem(entry, Object.keys(readingsObj), "charlist");
    }

    for (const [entry, readingsArr] of Object.entries(wordlist)) {
      addItem(entry, readingsArr, "wordlist");
    }

    parseEnglishIndex(englishIndex);
    if (cdict) for (const [ch, d] of Object.entries(cdict)) if (d) addHanzi(d.text || ch, d);

    status.textContent = `Loaded ${items.length} entries.`;
  } catch (err) {
    console.warn("JSON load timed out or failed. Using offline sample data.", err);
    status.textContent = `Loaded offline mode (${items.length} sample entry).`;
  }

  // Render initial view (uses cached items in memory, no re-fetching)
  if (initial) {
    search(initial);
  } else {
    showRandomFrontPage();
  }
}

let debounceTimer;
q.addEventListener('input', e => {
  clearTimeout(debounceTimer);
  const val = e.target.value;
  // If user cleared the input, go home immediately
  if (!val.trim()) {
    goHome();
    return;
  }
  // Debounce search by 300ms so it doesn't search on every single keystroke
  debounceTimer = setTimeout(() => {
    search(val);
  }, 500);
});

q.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    clearTimeout(debounceTimer);
    search(e.target.value);
  }
});
window.addEventListener('hashchange', () => {
  const term = decodeURIComponent(location.hash.slice(1));
  if (term !== q.value) search(term);
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function escapeJs(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

build().catch(err => {
  status.textContent = "Failed to load data.";
  out.innerHTML = "<pre>" + escapeHtml(String(err)) + "</pre>";
});
</script>
</body>
</html>
